# Optional local database prototypes only. No current source code connects to them.
services:
  arangodb:
    image: arangodb:3.11
    container_name: phantom-arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?required}
      ARANGO_NO_AUTH: "0"
    ports:
      - "127.0.0.1:8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    networks:
      - phantom-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: phantom-virtuoso
    environment:
      DBA_PASSWORD: ${VIRTUOSO_DBA_PASSWORD:?required}
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: https://phantom-metal-taste.org/graph
    ports:
      - "127.0.0.1:8890:8890"
      - "127.0.0.1:1111:1111"
    volumes:
      - virtuoso_data:/database
    networks:
      - phantom-network
    healthcheck:
      test: ["CMD-SHELL", "isql 1111 dba \"$${DBA_PASSWORD}\" EXEC=status()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arango_data:
  arango_apps:
  virtuoso_data:

networks:
  phantom-network:
    driver: bridge
