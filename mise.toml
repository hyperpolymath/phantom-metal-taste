#
# Estate toolchain: declarations stay on latest; mise.lock records concrete builds.
# Refresh with `just toolchain-refresh`; do not hand-edit mise.lock.
[settings]
lockfile = true

[tools]
just = "latest"
shellcheck = "latest"
rust = "latest"
julia = "latest"
bun = "latest"

[env]
JULIA_PROJECT = "."
