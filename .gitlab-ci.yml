# SPDX-License-Identifier: MPL-2.0
# GitLab mirrors use the same implemented-language gates as local Just recipes.
stages:
  - validate
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  JULIA_DEPOT_PATH: "$CI_PROJECT_DIR/.julia"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/
    - .julia/

bun-quality:
  stage: validate
  image: oven/bun:1.4.3
  script:
    - bun test
    - bun run build
    - sh scripts/check-site-reproducible.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

rust-quality:
  stage: test
  image: rust:1.90.0
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --all-targets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

julia-tests:
  stage: test
  image: julia:1.10
  script:
    - julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: deploy
  image: oven/bun:1.4.3
  script:
    - base_path="$(printf '%s\n' "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/$##')"
    - bun scripts/build-site.mjs --config site.json --out public --baseurl "$base_path"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
