# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for the current Rust, GitHub Actions, and Bun project.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    ignore:
      # HOLD: v4.38.1 fails GitHub workflow-startup validation estate-wide;
      # revisit when upstream has a verified newer release. The wildcard is
      # required because workflow refs use subpaths (/init and /analyze).
      - dependency-name: "github/codeql-action*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Suppress routine version PRs while allowing security updates.
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dependency-updates:
        patterns:
          - "*"
