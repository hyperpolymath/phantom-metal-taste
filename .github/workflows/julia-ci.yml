# SPDX-License-Identifier: MPL-2.0
name: Julia CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3.0.3
        with:
          version: "1.10"
          project: "."
      - name: Instantiate and test the analytics package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
